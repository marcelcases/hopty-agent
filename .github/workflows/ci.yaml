name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux/${{ matrix.arch }} release binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          build-args: |
            VERSION=${{ github.ref_name }}
            GOARCH=${{ matrix.arch }}
          outputs: type=local,dest=dist
      - name: Name and checksum binary
        run: |
          mv dist/hop dist/hopty_linux_${{ matrix.arch }}
          sha256sum dist/hopty_linux_${{ matrix.arch }} > dist/hopty_linux_${{ matrix.arch }}.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/hopty_linux_${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: hopty-agent-${{ matrix.arch }}
          path: dist/

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
