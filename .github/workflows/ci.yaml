name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux/${{ matrix.arch }} release binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          target: artifact
          build-args: |
            VERSION=${{ github.ref_name }}
            GOARCH=${{ matrix.arch }}
          outputs: type=local,dest=dist
      - name: Name and checksum binary
        run: |
          mv dist/hopty dist/hopty_linux_${{ matrix.arch }}
          sha256sum dist/hopty_linux_${{ matrix.arch }} > dist/hopty_linux_${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hopty-agent-${{ matrix.arch }}
          path: dist/

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hopty-agent-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Refresh staging Pages deployment
        env:
          HOPTY_PAGES_STAGING_DEPLOY_HOOK: ${{ secrets.HOPTY_PAGES_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOPTY_PAGES_STAGING_DEPLOY_HOOK" ]; then
            echo "staging Pages deploy hook is not configured; skipping refresh"
          else
            curl --fail --silent --show-error --retry 3 --request POST "$HOPTY_PAGES_STAGING_DEPLOY_HOOK" --output /dev/null
            echo "staging Pages refresh requested"
          fi
